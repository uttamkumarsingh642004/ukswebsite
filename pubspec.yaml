name: portfolio_website
description: A modern, interactive personal portfolio website built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Animation
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  animated_text_kit: ^4.2.2

  # Icons & Assets
  font_awesome_flutter: ^10.6.0
  flutter_animate: ^4.3.0

  # Utilities
  url_launcher: ^6.2.2
  visibility_detector: ^0.4.0+2
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Add your assets here
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
